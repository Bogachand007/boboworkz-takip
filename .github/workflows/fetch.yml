name: fetch-assets
on:
  push:
    paths: ['sbdl/urls.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          mkdir -p sbdl/img
          while read -r name url; do
            [ -z "$name" ] && continue
            [ -f "sbdl/img/$name.png" ] || curl -sSL -o "sbdl/img/$name.png" "$url"
          done < sbdl/urls.txt
      - name: commit
        run: |
          git config user.name "fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sbdl/img
          git commit -m "fetched assets [skip ci]" || exit 0
          git push
